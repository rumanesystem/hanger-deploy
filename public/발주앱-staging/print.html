<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>발주서 인쇄</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body{margin:0;padding:0;background:#f1f5f9}
    #toolbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 16px;background:#1e3a5f;
      position:sticky;top:0;z-index:100;
    }
    .btn-back{
      background:transparent;color:#fff;
      border:1.5px solid rgba(255,255,255,0.4);
      border-radius:8px;padding:8px 16px;
      font-size:14px;font-weight:700;cursor:pointer;
    }
    #doc-wrapper{
      max-width:794px;margin:0 auto;
      background:#fff;padding:24px 20px 120px;
    }
    #fab-print{
      position:fixed;bottom:28px;right:24px;
      width:72px;height:72px;border-radius:50%;
      background:#f59e0b;color:#fff;border:none;
      font-size:11px;font-weight:800;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      box-shadow:0 4px 16px rgba(0,0,0,0.3);
      z-index:200;
    }
    #fab-print i{font-size:24px}
    #error-msg{padding:32px;color:#dc2626;font-size:15px;font-weight:700;text-align:center}
    @media print{
      #toolbar,#fab-print{display:none!important}
      body{background:#fff}
      #doc-wrapper{padding:0}
      body>#doc-wrapper{display:block!important}
      @page{size:A4 portrait;margin:10mm 12mm}
      *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button class="btn-back" onclick="history.back()">
      <i class="fas fa-arrow-left"></i> 뒤로
    </button>
    <span style="color:#fff;font-size:13px;font-weight:600;opacity:0.8">발주서</span>
    <div style="width:70px"></div>
  </div>

  <div id="doc-wrapper">
    <div class="doc-detail-wrap" id="doc-container"></div>
  </div>

  <button id="fab-print" onclick="showPrintGuide()">
    <i class="fas fa-print"></i>
    <span>인쇄</span>
  </button>

  <!-- 인쇄 전 안내 모달 -->
  <div id="print-guide" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;display:none;align-items:flex-end;justify-content:center;">
    <div style="background:#fff;border-radius:16px 16px 0 0;padding:28px 24px 36px;width:100%;max-width:480px;text-align:center;">
      <div style="font-size:17px;font-weight:800;color:#111;margin-bottom:10px;">인쇄 화면 안내</div>
      <div style="font-size:14px;color:#444;line-height:1.7;margin-bottom:20px;">
        잠시 후 인쇄 화면이 열립니다.<br>
        화면 <strong>오른쪽 하단 ✓ 버튼</strong>을 누르면<br>인쇄가 완료됩니다.
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;background:#f1f5f9;border-radius:12px;padding:14px 20px;margin-bottom:24px;">
        <div style="font-size:13px;color:#555;">인쇄 화면 하단</div>
        <div style="font-size:13px;color:#555;">→</div>
        <div style="width:44px;height:44px;border-radius:50%;background:#607d8b;display:flex;align-items:center;justify-content:center;">
          <i class="fas fa-check" style="color:#fff;font-size:18px;"></i>
        </div>
        <div style="font-size:13px;font-weight:700;color:#1e3a5f;">← 이 버튼</div>
      </div>
      <button onclick="doPrint()" style="width:100%;background:#f59e0b;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;">
        확인 후 인쇄하기
      </button>
    </div>
  </div>

  <script>
    (function(){
      var html=sessionStorage.getItem('__print_doc__');
      if(!html){
        document.getElementById('doc-container').innerHTML=
          '<p id="error-msg">인쇄 데이터가 없습니다.<br>앱으로 돌아가서 다시 시도해주세요.</p>';
        document.getElementById('fab-print').style.display='none';
        return;
      }
      sessionStorage.removeItem('__print_doc__');
      document.getElementById('doc-container').innerHTML=html;
    })();

    function showPrintGuide(){
      var g=document.getElementById('print-guide');
      g.style.display='flex';
    }
    function doPrint(){
      document.getElementById('print-guide').style.display='none';
      window.print();
    }
  </script>
</body>
</html>
